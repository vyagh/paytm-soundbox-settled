<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settled board</title>
<style>
:root{
  --bg:#f4efda; --surface:#fbf8ec; --tint:#ede6ca; --line:#ddd5b5;
  --ink:#24243a; --ink2:#3e3e52; --muted:#67644f;
  --accent:#3f5a8a; --charged:#466129; --held:#7f5600; --not:#5e5c52; --mock:#9c4d00; --wait:#8a8778;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Nirmala UI",sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0}
html{font-size:clamp(15px,1.2vw,24px)}
body{background:var(--bg);color:var(--ink2);font-family:var(--sans);line-height:1.4;padding:1.1rem 1.4rem 2rem;min-height:100vh}
q{quotes:"\201C" "\201D"}

header{display:flex;align-items:baseline;gap:1rem;margin-bottom:1rem}
h1{font-size:1.9rem;color:var(--ink);letter-spacing:-.01em}
header p{color:var(--muted);font-size:1.05rem}
.live{margin-left:auto;display:flex;align-items:center;gap:.45rem;font-size:.95rem;font-weight:600;color:var(--charged)}
.live::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:currentColor}
.live.off{color:#a3263a}

.shops{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-bottom:1.3rem}
.card{background:var(--surface);border:2px solid var(--line);border-top:.45rem solid var(--wait);border-radius:14px;padding:.9rem 1.1rem 1rem;display:flex;flex-direction:column;gap:.6rem;transition:border-color .4s}
.card h2{font-size:1.45rem;color:var(--ink);line-height:1.2}
.card .who{font-size:.95rem;color:var(--muted);font-weight:500}
.status{align-self:flex-start;font-size:1.5rem;font-weight:700;padding:.2rem .9rem;border-radius:999px;display:flex;align-items:center;gap:.5rem}
.lines{display:flex;flex-direction:column;gap:.45rem;font-size:1.1rem;color:var(--ink)}
.lines div{display:grid;grid-template-columns:5.2rem 1fr;gap:.6rem;align-items:baseline}
.lines span{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.none{color:var(--wait)}
.card.flash{animation:flash 1.4s ease-out}
@keyframes flash{from{background:#fff3c4}to{background:var(--surface)}}

.s-waiting{color:var(--wait);background:var(--tint)}
.s-checking,.s-calling,.s-asking{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.s-charged{color:var(--charged);background:color-mix(in srgb,var(--charged) 16%,transparent)}
.s-held{color:var(--held);background:color-mix(in srgb,var(--held) 18%,transparent)}
.s-not{color:var(--not);background:color-mix(in srgb,var(--not) 16%,transparent)}
.s-checking::before,.s-calling::before,.s-asking::before{content:"";width:.55em;height:.55em;border-radius:50%;background:currentColor;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.2}}
.card.c-checking,.card.c-calling,.card.c-asking{border-top-color:var(--accent)}
.card.c-charged{border-top-color:var(--charged)}
.card.c-held{border-top-color:var(--held)}
.card.c-not{border-top-color:var(--not)}

h3{font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.5rem}
.log{background:var(--surface);border:2px solid var(--line);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:.95rem;table-layout:fixed}
th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--tint);padding:.5rem .6rem}
td{padding:.55rem .6rem;border-top:1px solid var(--line);vertical-align:top;color:var(--ink);overflow-wrap:anywhere}
tr.new td{animation:flash 1.4s ease-out}
td.t{font-family:var(--mono);color:var(--muted);font-size:.85rem}
td .sub{display:block;color:var(--ink2);font-size:.88rem;margin-top:.15rem}
td .reason{display:block;color:var(--muted);font-size:.85rem}
.o{display:inline-block;font-weight:700;padding:.05rem .55rem;border-radius:999px;white-space:nowrap}
.o.call,.o.ask{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.o.charged{color:var(--charged);background:color-mix(in srgb,var(--charged) 16%,transparent)}
.o.held{color:var(--held);background:color-mix(in srgb,var(--held) 18%,transparent)}
.o.not{color:var(--not);background:color-mix(in srgb,var(--not) 16%,transparent)}
.act{display:block}
.mock{display:inline-block;margin-left:.35rem;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mock);border:2px solid var(--mock);border-radius:5px;padding:0 .3rem;vertical-align:.1em}
.empty td{color:var(--wait);text-align:center;padding:1.5rem}
.card .top{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem}
.lang{flex:none;font-size:.85rem;font-weight:700;color:var(--accent);border:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:999px;padding:.05rem .6rem;white-space:nowrap}
.lines .gloss{display:block;font-size:.85rem;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:400;margin-top:.1rem}
.controls{display:flex;flex-direction:column;gap:.5rem;margin-top:auto;padding-top:.3rem}
.controls[hidden],.controls [hidden]{display:none}
.btn{font:inherit;font-size:1.05rem;font-weight:700;border-radius:10px;border:2px solid var(--accent);padding:.5rem 1rem;cursor:pointer;background:var(--surface);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.start{align-self:flex-start}
.btn.talk{background:var(--accent);color:#fff;font-size:1.2rem;padding:.8rem 1rem;touch-action:none;user-select:none;-webkit-user-select:none}
.btn.talk.on{background:#a3263a;border-color:#a3263a}
.typed{display:flex;gap:.4rem}
.typed input{flex:1;min-width:0;font:inherit;font-size:.95rem;padding:.35rem .55rem;border:2px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.typed button{font:inherit;font-size:.9rem;font-weight:600;border:2px solid var(--line);border-radius:8px;background:var(--tint);color:var(--ink2);padding:.3rem .7rem;cursor:pointer}
.note{font-size:.9rem;color:var(--muted);min-height:1.2em}
col.c-t{width:5.6rem} col.c-shop{width:8.6rem} col.c-what{width:20%} col.c-words{width:16%}
col.c-read{width:12%} col.c-rule{width:13%} col.c-out{width:8.2rem}
</style>
</head>
<body>
<header>
  <h1>Settled</h1>
  <p>First Soundbox rent, checked with the shopkeeper before it is taken</p>
  <div class="live off" id="live">connecting</div>
</header>

<section class="shops" id="shops"></section>

<h3>Decision log</h3>
<div class="log">
  <table>
    <colgroup><col class="c-t"><col class="c-shop"><col class="c-what"><col class="c-words"><col class="c-read"><col class="c-rule"><col class="c-out"><col></colgroup>
    <thead><tr><th>Time</th><th>Shop</th><th>What happened</th><th>His words</th><th>Read as</th><th>Rule</th><th>Outcome</th><th>Action</th></tr></thead>
    <tbody id="log"></tbody>
  </table>
</div>

<script>
let SHOPS = {};
const STATUS = {
  waiting: 'Waiting', checking: 'Checking records', calling: 'Calling', asking: 'Asking again',
  charged: 'Charged', held: 'Held', not: 'Not charged'
};
const STEPS = {
  'due': 'Rent due', 'records checked': 'Records checked', 'calling': 'Calling',
  'answered': 'Answered', 'decided': 'Decided', 'follow-up': 'Follow-up'
};
const OUTCOMES = {
  'call': ['call', 'Call'], 'ask again': ['ask', 'Ask again'], 'charged': ['charged', 'Charged'],
  'held': ['held', 'Held'], 'not charged': ['not', 'Not charged']
};
const MAX_ROWS = 200;

let rows = [];
let lastId = 0;
let lastAt = null;
let shown = {};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const time = at => (at || '').split('T').pop().slice(0, 8);

function statusOf(row, prev) {
  switch (row.outcome) {
    case 'charged': return 'charged';
    case 'held': return 'held';
    case 'not charged': return 'not';
    case 'ask again': return 'asking';
    case 'call': return 'calling';
  }
  switch (row.step) {
    case 'due': return 'waiting';
    case 'records checked': return 'checking';
    case 'calling':
    case 'answered': return 'calling';
  }
  return prev;
}

const FINAL = {'charged': 'charged', 'held': 'held', 'not charged': 'not'};

function shopState(key) {
  let s;
  for (const r of rows) {
    if (r.shop !== key) continue;
    if (r.step === 'due' || !s) s = {status: 'waiting', settled: false, said: null, heard: null, why: null};
    if (FINAL[r.outcome]) {
      s.status = FINAL[r.outcome];
      s.settled = true;
    } else if (!s.settled) {
      s.status = statusOf(r, s.status);
    }
    if (r.step === 'decided' && r.rule) s.why = r.rule;
    if (r.said) {
      s.said = r.said;
      s.heard = r.heard || (r.read_as === 'no answer' ? '' : null);
    }
  }
  return s || {status: 'waiting', said: null, heard: null, why: null};
}

function card(key) {
  let el = document.getElementById(`card-${key}`);
  if (el) return el;
  el = document.createElement('article');
  el.id = `card-${key}`;
  el.className = 'card c-waiting';
  el.innerHTML = `<div class="top"><h2></h2><span class="lang"></span></div>
    <div class="status s-waiting"></div>
    <div class="lines"></div>
    <div class="controls">
      <button class="btn start" type="button">Start call</button>
      <button class="btn talk" type="button" hidden>Hold to speak</button>
      <form class="typed" hidden><input name="text" placeholder="type instead" autocomplete="off" aria-label="Type his reply instead"><button>Send</button></form>
      <div class="note"></div>
    </div>`;
  el.querySelector('.start').onclick = () => startCall(key);
  const talk = el.querySelector('.talk');
  talk.addEventListener('pointerdown', e => { e.preventDefault(); talk.setPointerCapture(e.pointerId); holdStart(key); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) talk.addEventListener(ev, () => holdEnd(key));
  el.querySelector('.typed').onsubmit = e => {
    e.preventDefault();
    const input = e.target.elements.text;
    if (input.value.trim()) sendReply(key, JSON.stringify({text: input.value.trim()}), 'application/json').then(ok => { if (ok) input.value = ''; });
  };
  document.getElementById('shops').appendChild(el);
  return el;
}

function renderShops() {
  for (const [key, shop] of Object.entries(SHOPS)) {
    const s = shopState(key);
    const el = card(key);
    const flash = shown[key] && shown[key] !== s.status;
    shown[key] = s.status;
    if (el.dataset.status !== s.status) {
      el.dataset.status = s.status;
      el.className = `card c-${s.status}${flash ? ' flash' : ''}`;
    }
    el.querySelector('h2').innerHTML = `${esc(shop.name)}${shop.owner ? ` <span class="who">${esc(shop.owner)}</span>` : ''}`;
    el.querySelector('.lang').textContent = `${shop.language.name} · ${shop.language.own}`;
    const st = el.querySelector('.status');
    st.className = `status s-${s.status}`;
    st.textContent = STATUS[s.status];
    const native = s.said && shop.lines[s.said];
    const line = (label, text) => `<div><span>${label}</span>${text ? `<q>${esc(text)}</q>` : `<em class="none">${text === '' ? 'no reply' : 'nothing yet'}</em>`}</div>`;
    el.querySelector('.lines').innerHTML = s.said || !s.why
      ? (native ? `<div><span>Settled</span><p><q>${esc(native)}</q><span class="gloss">${esc(s.said)}</span></p></div>` : line('Settled', s.said)) + line('He said', s.heard)
      : `<div><span>Why</span>${esc(s.why)}</div>`;
    renderControls(key, el);
  }
}

const live = {};

function renderControls(key, el) {
  const call = SHOPS[key].call || {};
  const me = live[key] || (live[key] = {});
  const active = !!call.active;
  const listening = active && call.waiting && me.played === call.seq && !me.speaking;
  el.querySelector('.start').hidden = active;
  el.querySelector('.start').textContent = call.seq ? 'Call again' : 'Start call';
  const talk = el.querySelector('.talk');
  talk.hidden = !listening || !me.stream;
  talk.disabled = call.hearing || me.sending;
  talk.classList.toggle('on', !!me.rec);
  talk.textContent = me.rec ? 'Listening… let go to send' : call.hearing || me.sending ? 'Hearing…' : 'Hold to speak';
  el.querySelector('.typed').hidden = !listening;
  let note = me.note || '';
  if (active && me.speaking) note = 'Settled is speaking…';
  else if (active && !call.waiting) note = 'Working…';
  if (call.problem) note = call.problem;
  el.querySelector('.note').textContent = note;

  if (active && call.waiting && me.played !== call.seq) {
    me.played = call.seq;
    me.note = '';
    if (!call.voice) return;
    me.speaking = true;
    const audio = new Audio(`/api/call/${key}/audio/${call.seq}`);
    const done = () => { me.speaking = false; renderShops(); };
    audio.onended = done;
    audio.onerror = done;
    audio.play().catch(done);
    renderControls(key, el);
  }
}

async function startCall(key) {
  const me = live[key] || (live[key] = {});
  me.note = '';
  if (!me.stream && navigator.mediaDevices?.getUserMedia) {
    try {
      me.stream = await navigator.mediaDevices.getUserMedia({audio: true});
    } catch (e) {
      me.note = 'No mic, type his reply instead';
    }
  } else if (!me.stream) {
    me.note = 'No mic here, type his reply instead';
  }
  const res = await fetch(`/api/call/${key}/start`, {method: 'POST'});
  if (!res.ok) me.note = (await res.json()).error || 'could not start';
  await refreshShops();
}

function holdStart(key) {
  const me = live[key];
  if (!me?.stream || me.rec) return;
  const chunks = [];
  const rec = new MediaRecorder(me.stream);
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const seconds = (performance.now() - me.t0) / 1000;
    me.rec = null;
    if (seconds < 0.4) { me.note = 'Hold the button while you talk'; renderShops(); return; }
    const blob = new Blob(chunks, {type: rec.mimeType || 'audio/webm'});
    sendReply(key, blob, blob.type, seconds);
  };
  me.rec = rec;
  me.t0 = performance.now();
  rec.start();
  renderShops();
}

function holdEnd(key) {
  const me = live[key];
  if (me?.rec && me.rec.state === 'recording') me.rec.stop();
}

async function sendReply(key, body, type, seconds) {
  const me = live[key] || (live[key] = {});
  const call = SHOPS[key].call;
  me.sending = true;
  me.note = '';
  renderShops();
  const headers = {'Content-Type': type};
  if (seconds) headers['X-Seconds'] = seconds.toFixed(2);
  let ok = false;
  try {
    const res = await fetch(`/api/call/${key}/reply?seq=${call.seq}`, {method: 'POST', headers, body});
    const got = await res.json();
    ok = res.ok;
    me.note = ok ? `Heard: ${got.heard}` : `${got.error || 'failed'}. Try again or type it.`;
  } catch (e) {
    me.note = 'Network failed. Try again or type it.';
  }
  me.sending = false;
  await refreshShops();
  return ok;
}

async function refreshShops() {
  const res = await fetch('/api/shops', {cache: 'no-store'});
  if (!res.ok) throw new Error(res.status);
  SHOPS = Object.fromEntries((await res.json()).map(s => [s.id, s]));
  renderShops();
}

function actions(text) {
  if (!text) return '';
  return text.split(/\s*;\s*/).filter(Boolean).map(a => {
    const mock = /\(mock\)/i.test(a);
    const name = a.replace(/\s*\(mock\)\s*/i, ' ').trim();
    return `<span class="act">${esc(name)}${mock ? '<span class="mock">mock</span>' : ''}</span>`;
  }).join('');
}

function renderLog(freshFrom) {
  const body = document.getElementById('log');
  if (!rows.length) {
    body.innerHTML = '<tr class="empty"><td colspan="8">No checks yet</td></tr>';
    return;
  }
  const prevSaid = {};
  const newSaid = new Set();
  for (const r of rows) {
    if (r.said && r.said !== prevSaid[r.shop]) newSaid.add(r.id);
    if (r.step === 'due') delete prevSaid[r.shop];
    if (r.said) prevSaid[r.shop] = r.said;
  }
  body.innerHTML = rows.slice(-MAX_ROWS).reverse().map(r => {
    const out = OUTCOMES[r.outcome];
    return `<tr${r.id > freshFrom ? ' class="new"' : ''}>
      <td class="t">${esc(time(r.at))}</td>
      <td>${esc(SHOPS[r.shop]?.name || r.shop)}</td>
      <td>${esc(STEPS[r.step] || r.step)}${newSaid.has(r.id) ? `<span class="sub">Settled: <q>${esc(r.said)}</q></span>` : ''}${!r.read_as && r.reason ? `<span class="sub">${esc(r.reason)}</span>` : ''}</td>
      <td>${r.heard ? `<q>${esc(r.heard)}</q>` : r.read_as === 'no answer' ? '<em class="none">no reply</em>' : ''}</td>
      <td>${esc(r.read_as)}${r.read_as && r.reason ? `<span class="reason">${esc(r.reason)}</span>` : ''}</td>
      <td>${esc(r.rule)}</td>
      <td>${out ? `<span class="o ${out[0]}">${out[1]}</span>` : esc(r.outcome)}</td>
      <td>${actions(r.action)}</td>
    </tr>`;
  }).join('');
}

async function fetchAfter(id) {
  const res = await fetch(`/api/log?after=${id}`, {cache: 'no-store'});
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

async function poll() {
  const live = document.getElementById('live');
  try {
    let got = await fetchAfter(Math.max(lastId - 1, 0));
    let freshFrom = lastId || Infinity;
    let reset = false;
    if (lastId > 0) {
      const anchor = got[0];
      if (!anchor || anchor.id !== lastId || anchor.at !== lastAt) {
        reset = true;
        rows = [];
        shown = {};
        freshFrom = Infinity;
        got = await fetchAfter(0);
      } else {
        got = got.slice(1);
      }
    }
    if (got.length || reset) {
      rows = rows.concat(got);
      const last = rows[rows.length - 1];
      lastId = last ? last.id : 0;
      lastAt = last ? last.at : null;
      renderLog(freshFrom);
    }
    await refreshShops();
    live.className = 'live';
    live.textContent = 'live';
  } catch (e) {
    live.className = 'live off';
    live.textContent = 'not connected';
  }
  setTimeout(poll, 1000);
}

renderLog(0);
poll();
</script>
</body>
</html>
