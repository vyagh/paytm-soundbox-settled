<div class="page" id="page">
  <header class="bar-top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#34528a"/><path d="M11 13.5h18a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-9l-5.5 4v-4H11a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3z" fill="#fffdf8"/><path d="M15 20.5l3.4 3.2 6.6-6.7" fill="none" stroke="#34528a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1>Settled</h1><p>First Soundbox rent, checked with the shopkeeper before it is taken</p></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Shops"></nav>
    <div class="live off" id="live">connecting</div>
  </header>
  <div class="main">
    <section class="stage" aria-label="The call, as a machine">
      <span class="corner fig">Fig. 1</span>
      <span class="corner title" id="c-title">One call, live</span>
      <div class="holder" id="holder"></div>
      <span class="corner hint">The parts move with the real call</span>
      <span class="corner readout" id="readout" aria-live="polite"></span>
    </section>
    <aside class="panel" id="panel">
      <div class="head"><h2 id="p-name"></h2><select class="lang" id="p-lang" aria-label="Language for the next call"></select></div>
      <div class="turn settled" id="p-settled"><span class="label" id="p-settled-label">Settled will ask</span><p class="native" id="p-native"></p><p class="gloss" id="p-gloss"></p></div>
      <div class="turn him" id="p-him"><span class="label" id="p-him-label">He said</span><div class="words" id="p-words"></div><div class="meter" id="p-meter" hidden></div><p class="read" id="p-read"></p></div>
      <div id="p-outcome"></div>
      <ul class="texts" id="p-texts"></ul>
      <div class="controls">
        <button class="btn start" id="p-start" type="button"></button>
        <button class="btn talk" id="p-talk" type="button" hidden></button>
        <form class="typed" id="p-typed" hidden><input name="text" placeholder="type instead" autocomplete="off" aria-label="Type his reply instead"><button>Send</button></form>
        <div class="note" id="p-note"></div>
      </div>
    </aside>
  </div>
</div>
<div class="embed-box" id="embed-box"></div>
